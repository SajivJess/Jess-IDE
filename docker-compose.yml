services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jess-ide-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./jess_dev.db
      - MODEL_API_KEY=${MODEL_API_KEY}
      - AGENT_PROVIDER=${AGENT_PROVIDER:-meta}
      - META_MODEL_ID=${META_MODEL_ID:-muse-spark-1.3}
      - META_MODEL_BASE_URL=${META_MODEL_BASE_URL:-https://api.meta.ai/v1}
      - CORS_ORIGINS=["*"]
    volumes:
      - ./backend/workspaces_data:/app/workspaces_data
      - ./backend/jess_dev.db:/app/jess_dev.db
